<!DOCTYPE html>
<html>
    <head>
        <title>Number Guessing Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game">
            <form>
                <h1>Number Guessing Game</h1>
                <label for="text"><h2>Enter a random number from 1-10:</h2></label>
                <input type="textbox" placeholder="Enter a number" id="user-input"><br><br>
                <button type="button" onclick="boxPrint()">Submit</button>
                <button type="button" onclick="newGame()">New game</button>
                <p id="display"><b>Result:</b></p>
            </form>
        </div>

    <script src="script.js"></script>
    </body>
</html>
